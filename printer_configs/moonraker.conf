[server]
# Bind server defaults of 0.0.0.0, port 7125
klippy_uds_address: /tmp/uds

[machine]
provider: none
validate_service: false
validate_config: false

[file_manager]
file_system_observer: none

[authorization]
# A fresh home printer intentionally follows a first-claim model: until a
# normal Moonraker user exists, the first LAN client may set it up.  Pinned
# Moonraker applies force_logins as soon as that user is created, so the same
# trusted_clients entry no longer grants general access after onboarding.
enable_api_key: true
force_logins: true
trusted_clients:
  0.0.0.0/0

cors_domains:
  *
# CORS supports the browser UI but is not the authentication boundary.  The
# post-first-user boundary is Moonraker JWT/API-key authorization.  Exact UI
# origins remain an AD5M-016 compatibility follow-up.

# Enable OctoPrint compatibility for Slicer uploads
# Supports Cura, Slic3r, and Slic3r dervivatives
# (PrusaSlicer, SuperSlicer)
[octoprint_compat]

# Allow the printer to be found via MDNS (hostname.local)
[zeroconf]

# Enable print history tracking
[history]

# Default webcam config values
# flip_h = false
# flip_v = false
# rotate_90 = false
# stream_url = /webcam/?action=stream
# webcam_enabled = true
